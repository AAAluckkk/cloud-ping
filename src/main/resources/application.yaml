server:
  port: 8081
spring:
  profiles:
    active: dev
  application:
    name: hmdp
  # 上传文件大小限制。Spring 默认单文件只有 1MB，
  # 手机拍的照片随便就 2~5MB，不改这里头像和笔记图片都传不上去
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    # 连接信息已外置到 application-dev.yaml（该文件不进版本库）
    url: jdbc:mysql://${hmdp.datasource.host}:${hmdp.datasource.port}/${hmdp.datasource.database}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${hmdp.datasource.username}
    password: ${hmdp.datasource.password}
  redis:
    host: ${hmdp.redis.host}
    port: ${hmdp.redis.port}
    #password: ${hmdp.redis.password}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug